model:
  arch: "efficientnet_b0"
  timm_name: "efficientnet_b0"
  num_classes: 7
  pretrained: true
  dropout: 0.2

training:
  epochs: 15
  batch_size: 32
  lr: 0.0003
  weight_decay: 0.0001
  loss: "weighted_cross_entropy"
  optimizer: "adamw"
  scheduler: "cosine"

data:
  metadata_csv: "data/raw/ham10000/HAM10000_metadata.csv"
  splits_dir: "data/splits"
  image_size: 224
  classes:
    - "akiec"
    - "bcc"
    - "bkl"
    - "df"
    - "mel"
    - "nv"
    - "vasc"

smoke:
  num_samples: 200
  epochs: 1
  batch_size: 16
  device: "cpu"
