<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1F3A" />
      <stop offset="100%" stop-color="#0E9F8E" />
    </linearGradient>
    <linearGradient id="cross" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>
  </defs>
  <!-- Background with safe zone rounded rectangle -->
  <rect width="512" height="512" rx="104" fill="url(#bg)" />
  <!-- Scanner reticle circle -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="8" stroke-dasharray="16 12" />
  <!-- Corner optical brackets -->
  <path d="M140 180 V 140 H 180" fill="none" stroke="#2DD4BF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M372 180 V 140 H 332" fill="none" stroke="#2DD4BF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M140 332 V 372 H 180" fill="none" stroke="#2DD4BF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M372 332 V 372 H 332" fill="none" stroke="#2DD4BF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Medical Cross / AI Lesion Detection Node -->
  <rect x="228" y="166" width="56" height="180" rx="28" fill="url(#cross)" />
  <rect x="166" y="228" width="180" height="56" rx="28" fill="url(#cross)" />
  <!-- Central Focus Sensor Node -->
  <circle cx="256" cy="256" r="24" fill="#FFFFFF" />
  <circle cx="256" cy="256" r="12" fill="#0E9F8E" />
</svg>
