services:
  - type: web
    name: dermai-api
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu && pip install --no-cache-dir -r backend/requirements.txt"
    startCommand: "python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHONPATH
        value: .
      - key: STORAGE_BACKEND
        value: local
      - key: MEDICAL_DISCLAIMER
        value: "AI-assisted analysis, not a standalone medical diagnosis."
      - key: DERMAI_CONFIDENCE_THRESHOLD
        value: "0.50"
      - key: SECRET_KEY
        generateValue: true
